name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional release notes
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        run: node scripts/ci-configure-signing.mjs

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          test -s android/app/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          echo "tag=v${VERSION}-${CODE}" >> "$GITHUB_OUTPUT"
          echo "apk=opencode-remote-${VERSION}-${CODE}.apk" >> "$GITHUB_OUTPUT"

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.tag }}
          path: mobile/${{ steps.version.outputs.apk }}
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.apk }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "OpenCode Remote $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "OpenCode Remote $TAG" --notes "Built from ${GITHUB_SHA}."
          fi
